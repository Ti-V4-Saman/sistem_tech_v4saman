# ============================================================
# Configuração do Nginx para TechOps Saman (techops.v4saman.com)
# ============================================================

# Servidor HTTP (Porta 80): Redireciona para HTTPS & Atende desafio Certbot Let's Encrypt
server {
    listen 80;
    listen [::]:80;
    server_name techops.v4saman.com;

    # Desafio ACME do Certbot para validação de certificado SSL
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirecionamento automático para HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# Servidor HTTPS (Porta 443)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name techops.v4saman.com;

    # Certificados SSL gerados pelo Certbot / Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/techops.v4saman.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/techops.v4saman.com/privkey.pem;

    # Protocolos e Cifras SSL Seguras
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Cabeçalhos de Segurança HTTP
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compactação Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Pasta raiz do Frontend compilado (Vite React)
    root /usr/share/nginx/html;
    index index.html;

    # Proxy para as requisições de API (Backend Express na porta 3000)
    location /api/ {
        proxy_pass http://api:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
    }

    # Roteamento de rotas estáticas (Cache inteligente para assets)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Roteamento SPA (Single Page Application fallback para o React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
